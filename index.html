<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>ОСГОворим</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ОСГОворим">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <div class="auth-icon">🚨</div>
        <h1 class="auth-logo">ОСГОворим</h1>
        <p class="auth-sub">Войди чтобы участвовать</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Вход</button>
        <button class="auth-tab" id="tabRegister">Регистрация</button>
      </div>
      <form id="authForm" autocomplete="on">
        <div class="field-group">
          <label class="field-label">Логин</label>
          <input class="field-input" id="authUsername" type="text" placeholder="введи логин" autocomplete="username" required>
        </div>
        <div class="field-group">
          <label class="field-label">Пароль</label>
          <input class="field-input" id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p class="auth-error hidden" id="authError"></p>
        <button class="auth-submit" id="authSubmit" type="submit">Войти</button>
      </form>
    </div>
  </div>

  <!-- ПРИЛОЖЕНИЕ -->
  <div id="appScreen" class="app hidden">

    <header class="app-header">
      <div class="header-left">
        <span class="header-logo">ОСГОворим</span>
        <span class="conn-dot" id="connDot"></span>
        <span class="header-status" id="wsStatus">подключение…</span>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Выйти">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Выйти
      </button>
    </header>

    <main class="main">
      <button class="pizdets-btn" id="pizdetsBtn">ПИЗДЕЦ</button>

      <div class="online-box">
        <div class="online-title">
          ОНЛАЙН
          <span class="online-badge" id="onlineCount">0</span>
        </div>
        <ul class="user-list" id="userList"></ul>
      </div>
    </main>

  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
