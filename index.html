<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>ОСГОворим</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ОСГОворим">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ЭКРАН АВТОРИЗАЦИИ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <div class="auth-icon">💬</div>
        <h1 class="auth-logo">ОСГОворим</h1>
        <p class="auth-sub">Мессенджер без посредников</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Вход</button>
        <button class="auth-tab" id="tabRegister">Регистрация</button>
      </div>
      <form id="authForm" autocomplete="on">
        <div class="field-group">
          <label class="field-label">Логин</label>
          <input class="field-input" id="authUsername" type="text" placeholder="введи логин" autocomplete="username" required>
        </div>
        <div class="field-group">
          <label class="field-label">Пароль</label>
          <input class="field-input" id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p class="auth-error hidden" id="authError"></p>
        <button class="auth-submit" id="authSubmit" type="submit">Войти</button>
      </form>
    </div>
  </div>

  <!-- ПРИЛОЖЕНИЕ -->
  <div id="appScreen" class="app hidden">

    <header class="app-header">
      <div class="header-left">
        <button class="icon-btn" id="sidebarToggle" title="Участники">👥</button>
        <span class="header-logo">ОСГОворим</span>
        <span class="conn-dot" id="connDot"></span>
        <span class="header-status" id="wsStatus">подключение…</span>
      </div>
      <div class="header-right">
        <button class="pizdets-btn" id="pizdetsBtn">Пиздец</button>
        <button class="icon-btn" id="logoutBtn" title="Выйти">⎋</button>
      </div>
    </header>

    <div class="app-body">

      <aside class="sidebar open" id="sidebar">
        <div class="sidebar-header">
          Онлайн&nbsp;<span class="online-badge" id="onlineCount">0</span>
        </div>
        <ul class="user-list" id="userList"></ul>
      </aside>

      <main class="chat-area">
        <div class="messages" id="messages">
          <div class="messages-empty" id="messagesEmpty">Напиши первое сообщение</div>
        </div>
        <div class="input-bar">
          <input class="msg-input" id="msgInput" type="text" placeholder="Сообщение…" autocomplete="off" maxlength="2000">
          <button class="send-btn" id="sendBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </main>

    </div>

    <!-- Кнопка установки -->
    <div id="installBanner" class="install-banner hidden">
      <span class="install-icon">📲</span>
      <div class="install-text">
        <b>Установить приложение</b>
        <small id="installHint">Работает офлайн</small>
      </div>
      <button class="install-action" id="installBtn">Установить</button>
      <button class="install-close" id="installClose">✕</button>
    </div>

  </div>

  <!-- Тост -->
  <div class="toast hidden" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
