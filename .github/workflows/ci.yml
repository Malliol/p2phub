name: tests

# Запускаем тесты при каждом пуше и pull request в main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Зависимостей нет — тесты на встроенном раннере Node.
      - name: Run tests
        run: node --test
